# Runs `pnpm verify` (generate + typecheck + tests + build) on every push and
# pull request. PRD §4.17.
name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma's config refuses to load without a URL. Nothing in verify
      # connects to it; port 1 makes any accidental connection fail loudly
      # rather than reach a real database (R17.4).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
